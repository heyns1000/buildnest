services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: faa
      POSTGRES_PASSWORD: faapass
      POSTGRES_DB: faazone
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faa -d faazone"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://faa:faapass@db:5432/faazone
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install --legacy-peer-deps && npx drizzle-kit push && npm run dev"

  scroll-backend:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    command: sh -c "pip install --no-cache-dir --quiet fastapi uvicorn aiohttp dnspython pyjwt cryptography pydantic python-multipart && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

volumes:
  pgdata:
  node_modules:
