services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: faa
      POSTGRES_PASSWORD: faapass
      POSTGRES_DB: faazone
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faa -d faazone"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: node:22
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      - PORT=3000
      - DATABASE_URL=postgresql://faa:faapass@db:5432/faazone
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install --legacy-peer-deps && npx drizzle-kit push && npm run dev"

volumes:
  pgdata:
  node_modules:
